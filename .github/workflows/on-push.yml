name: Production

on:
  push:
    branches:
      - main
  # Nightly, so the release tags on the projects pick up new releases.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
