name: Pull Request Workflow
on: [pull_request]
jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Node Setup
        uses: actions/setup-node@main
        with:
          node-version: '24.x'
          cache: yarn
          corepack: true
      - name: Prepare Yarn
        run: corepack prepare yarn@4.15.0 --activate
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test:ci
  initialize_and_validate:
    name: Initialize and Validate
    runs-on: ubuntu-latest
    needs: [build_and_test]
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: Terraform Init
        uses: hashicorp/terraform-github-actions@main
        with:
          tf_actions_version: 1.55.5
          tf_actions_subcommand: 'init'
          tf_actions_working_dir: './infrastructure/terraform'
          tf_actions_comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Terraform Validate
        uses: hashicorp/terraform-github-actions@main
        with:
          tf_actions_version: 1.55.5
          tf_actions_subcommand: 'validate'
          tf_actions_working_dir: './infrastructure/terraform'
          tf_actions_comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Terraform Plan
        uses: hashicorp/terraform-github-actions@main
        with:
          tf_actions_version: 1.55.5
          tf_actions_subcommand: 'plan'
          tf_actions_working_dir: './infrastructure/terraform'
          tf_actions_comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
