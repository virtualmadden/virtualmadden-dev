name: Deploy to Production
on:
  push:
    branches:
    - main
jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Node Setup
        uses: actions/setup-node@main
        with:
          node-version: '24.x'
          cache: yarn
          corepack: true
      - name: Prepare Yarn
        run: corepack prepare yarn@4.15.0 --activate
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test:ci
      - name: Upload Artifacts
        uses: actions/upload-artifact@main
        with:
          name: build_artifacts
          path: './build'
  initialize_and_deploy:
    name: Initialize and Deploy
    runs-on: ubuntu-latest
    needs: [build_and_test]
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Download Artifacts
        uses: actions/download-artifact@main
        with:
          name: build_artifacts
          path: './build'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: 'Terraform Initialize'
        uses: hashicorp/terraform-github-actions@main
        with:
          tf_actions_version: 1.55.5
          tf_actions_subcommand: 'init'
          tf_actions_working_dir: './infrastructure/terraform'
          tf_actions_comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Terraform Apply'
        uses: hashicorp/terraform-github-actions@main
        with:
          tf_actions_version: 1.55.5
          tf_actions_subcommand: 'apply'
          tf_actions_working_dir: './infrastructure/terraform'
          tf_actions_comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: sync
        run: aws s3 sync ./build s3://virtualmadden.dev --exclude \"*.DS_Store*\"
      - name: cache
        run: aws s3 cp ./build/index.html s3://virtualmadden.dev/index.html --cache-control max-age=0
